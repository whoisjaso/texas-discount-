# The narrated cut's voice venv, frozen from the venv that voiced the approved Discount set (Python 3.11.15,
# 2026-10-02). scripts/setup.sh --voice installs it into $VOICE_VENV:
#   1. torch from the PyTorch CPU index FIRST (from PyPI pip would pull the multi-GB CUDA build):
#        pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu
#   2. then this file: pip install -r requirements.lock
# Kokoro-82M (TTS), misaki + espeakng-loader (phonemes: the bundled espeak-ng library; a system espeak-ng is NOT
# needed), spaCy en_core_web_sm (misaki's English tagger, a GitHub release wheel), faster-whisper + ctranslate2
# (the transcribe-back check). The model weights are not pip packages: setup.sh fetches hexgrad/Kokoro-82M and
# Systran/faster-whisper-small.en into HF_HOME.
# torch==2.14.1+cpu   (installed in step 1, kept out of this file on purpose)
